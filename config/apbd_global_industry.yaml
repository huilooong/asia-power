version: 1
updated: "2026-09-03"
owner: "APBD pre-sales"
commercial_source_of_truth: "APSales"

governance:
  worker_external_draft_enabled: false
  worker_external_send_enabled: false
  allowed_auto_send_country_codes: []
  separate_send_gate_country_codes:
    - CA
    - VE
  excluded_country_codes:
    - GH
    - RU
    - BY
    - IR
    - KP
    - SY
    - CU
  third_party_email_send_eligible: false
  importer_alone_is_exporter: false

runtime:
  batch_limit: 6
  backlog_enrichment_limit: 2
  website_pages: 3
  website_timeout_seconds: 7
  retry_failed_website_after_days: 14
  load_max: 1.8
  idle_sleep_seconds: 900
  busy_sleep_seconds: 120
  quota_sleep_seconds: 3600
  error_sleep_seconds: 600
  notify_on_routine_progress: false

