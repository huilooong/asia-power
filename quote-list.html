<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Quote List | AsiaPower</title>
  <link rel="stylesheet" href="css/styles.css?v=mnav-drawer-v1">
  <link rel="stylesheet" href="css/ebay-layout.css?v=site-consistency-v1" data-ebay-layout="1">
  <link rel="stylesheet" href="css/quote-list.css?v=quote-list-v1">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/sitewide-secondary-v1.css?v=sitewide-secondary-v1" data-sitewide-secondary="1">
</head>
<body data-page="quote-list">
  <div id="site-topbar"></div>
  <div id="site-header"></div>
  <main id="main-content" class="quote-list-page">
    <h1 data-i18n="quoteList.title">Quote list</h1>
    <p class="lead" data-i18n="quoteList.lead">Add units from product pages, then send one WhatsApp inquiry for the whole list. This is not checkout — our team confirms price and shipping.</p>
    <div id="quote-list-root"></div>
    <div class="quote-list-actions" id="quote-list-actions" hidden>
      <a class="btn btn-wa" id="quote-wa" href="#" target="_blank" rel="noopener" data-i18n="quoteList.whatsapp">WhatsApp this list</a>
      <button type="button" class="btn btn-clear" id="quote-clear" data-i18n="quoteList.clear">Clear list</button>
    </div>
  </main>
  <div id="site-footer"></div>
  <div id="site-whatsapp"></div>
  <script src="js/path-utils.js?v=sitewide-secondary-v1"></script>
  <script src="js/public-i18n.js?v=sitewide-secondary-v1"></script>
  <script src="js/config.js?v=seo-guides-20260716"></script>
  <script src="js/whatsapp-crm.js?v=quote-list-v1"></script>
  <script src="js/quote-list.js?v=sitewide-secondary-v1"></script>
  <script src="js/components.js?v=sitewide-secondary-v1" defer></script>
  <script src="js/main.js?v=sitewide-secondary-v1" defer></script>
  <script>
    (function () {
      const root = document.getElementById('quote-list-root');
      const actions = document.getElementById('quote-list-actions');
      const wa = document.getElementById('quote-wa');
      const clearBtn = document.getElementById('quote-clear');

      function tr(key, fallback) {
        return window.PublicI18n?.t(key, fallback) ?? fallback;
      }

      function money(n) {
        if (n == null || !Number.isFinite(Number(n))) return '—';
        return '$' + Math.round(Number(n)).toLocaleString('en-US');
      }

      function render() {
        const items = window.QuoteList.read();
        window.QuoteList.refreshBadges();
        if (!items.length) {
          root.innerHTML = `<div class="quote-list-empty">${tr('quoteList.emptyHtml', 'Your quote list is empty. Open a product page and tap <strong>Add to quote list</strong>.')}</div>`;
          actions.hidden = true;
          return;
        }
        actions.hidden = false;
        wa.href = window.QuoteList.bulkWhatsAppUrl(items);
        root.innerHTML = `<table class="quote-list-table">
          <thead><tr><th>#</th><th>${tr('quoteList.unit', 'Unit')}</th><th>${tr('quoteList.qty', 'Qty')}</th><th>EXW</th><th></th></tr></thead>
          <tbody>
            ${items.map((it, i) => `<tr>
              <td>${i + 1}</td>
              <td>
                <strong>${it.stockId}</strong>
                ${it.partLabel || it.partType ? ` · ${it.partLabel || it.partType}` : ''}<br>
                ${[it.year, window.PublicI18n?.officialBrandName?.(it.brand) || it.brand, it.model].filter(Boolean).join(' ')}
                ${it.engineCode ? ` · ${it.engineCode}` : ''}
                ${it.pageUrl ? `<br><a href="${it.pageUrl}">${tr('quoteList.viewListing', 'View listing')}</a>` : ''}
              </td>
              <td>${it.qty || 1}</td>
              <td>${money(it.priceUsd)}${it.priceNote ? `<span class="quote-list-price-note">${it.priceNote}</span>` : ''}</td>
              <td><button type="button" data-remove-stock="${it.stockId}" data-remove-part="${it.partType || ''}">${tr('quoteList.remove', 'Remove')}</button></td>
            </tr>`).join('')}
          </tbody>
        </table>`;
        root.querySelectorAll('[data-remove-stock]').forEach((btn) => {
          btn.addEventListener('click', () => {
            window.QuoteList.remove(btn.getAttribute('data-remove-stock'), btn.getAttribute('data-remove-part') || '');
            render();
          });
        });
      }

      clearBtn.addEventListener('click', () => {
        window.QuoteList.clear();
        render();
      });
      window.addEventListener(window.QuoteList.CHANGE_EVENT, render);
      window.addEventListener('asiapower:langchange', render);
      document.addEventListener('DOMContentLoaded', render);
      render();
    })();
  </script>
</body>
</html>
