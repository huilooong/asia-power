<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采购商工作台 · AsiaPower</title>
  <link rel="stylesheet" href="/css/portal-app.css">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
</head>
<body data-page="buyer-portal" data-portal-shell="v4">
  <div class="wrap">
    <div class="hero-mini">
      <div class="kicker">采购商工作台 · v4</div>
      <h1>报价与定金订单</h1>
      <p>每次登录都会保存账号信息。游客仍可询价，无需注册。</p>
    </div>

    <section class="panel" id="login-gate">
      <h2>请先登录</h2>
      <p class="sub">请到统一登录页登录 — 采购商可用 Google 或手机号+密码。</p>
      <a class="btn btn-primary" href="/login/?role=buyer&next=/buyer-portal/">去登录</a>
    </section>

    <section class="panel" style="margin-top:20px" id="portal" hidden>
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px">
        <div>
          <h2 style="margin:0">欢迎，<span id="buyer-name">采购商</span></h2>
          <p class="sub" id="buyer-meta" style="margin:4px 0 0"></p>
        </div>
        <button class="btn btn-ghost" type="button" id="logout-btn">退出登录</button>
      </div>
      <p class="sub" id="deposit-banner"></p>
      <table class="table">
        <thead>
          <tr><th>订单</th><th>库存</th><th>EXW</th><th>定金</th><th>状态</th><th></th></tr>
        </thead>
        <tbody id="order-rows"></tbody>
      </table>
    </section>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/v4-portal-shell.js?v=zh-ui-v1"></script>
  <script src="/js/buyer-portal.js?v=zh-ui-v1"></script>
  <script>window.AsiaPowerV4PortalShell?.mount('buyer');</script>
</body>
</html>
